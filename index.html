const $=id=>document.getElementById(id);
function say(t){$('log').innerHTML+=`<br>${t}`;$('log').scrollTop=$('log').scrollHeight}
function paint(){$('heroSprite').style.backgroundPosition=pos[mood];$('moodLabel').textContent=moods[mood];$('moodStat').textContent='감정: '+moods[mood];$('hpText').textContent=hp+' / 100';$('mpText').textContent=mp+' / 30';$('hpBar').style.width=hp+'%';$('mpBar').style.width=(mp/30*100)+'%';$('foeBar').style.width=(foe/120*100)+'%'}
function end(win){ended=true;$('notice').textContent=win?'승리! 꿈먹는 눈을 물리쳤다.':'패배… 다시 도전해 보자.';$('restart').style.display='block';say(win?'[SYSTEM] 전투에서 승리했다!':'[SYSTEM] 쓰러졌다...')}
function enemy(){if(foe<=0){end(true);return}let d=def?5:13;def=false;hp=Math.max(0,hp-d);say(`꿈먹는 눈의 공격! ${d} 피해를 받았다.`);paint();if(hp<=0)end(false)}
function act(a){if(ended)return;let msg='';
if(a==='attack'){let d= mood===2?24:mood===1?17:mood===3?13:19;foe=Math.max(0,foe-d);msg=`공격! 적에게 ${d} 피해.`}
if(a==='skill'){if(mp<10){$('notice').textContent='MP가 부족해!';return}mp-=10;let d=mood===1?34:mood===2?28:25;foe=Math.max(0,foe-d);msg=`꿈의 파동! 적에게 ${d} 피해.`}
if(a==='emotion'){mood=(mood+1)%4;msg=`감정이 ${moods[mood]}으로 변했다!`;paint();say(msg);$('notice').textContent=msg;return}
if(a==='item'){if(items<=0||hp===100){$('notice').textContent='사용할 수 없어!';return}let old=hp;hp=Math.min(100,hp+30);items--;msg=`사탕을 먹었다. HP ${hp-old} 회복! 남은 사탕 ${items}개.`}
if(a==='defend'){def=true;msg='방어 자세를 취했다. 다음 공격 피해 감소!'}
if(a==='run'){msg='도망치는 데 성공했다!';say(msg);end(false);return}
say(msg);$('notice').textContent=msg;paint();if(foe<=0){end(true);return}enemy()}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
$('restart').addEventListener('click',()=>{hp=100;mp=30;foe=120;mood=0;items=2;def=false;ended=false;$('log').innerHTML='[SYSTEM] 꿈의 숲에 들어섰다.<br>[SYSTEM] 꿈먹는 눈이 나타났다!';$('notice').textContent='행동을 선택해 전투를 시작해!';$('restart').style.display='none';paint()});paint();
})();
</script></body></html>
